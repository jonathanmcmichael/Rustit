name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Reject newly vulnerable dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
