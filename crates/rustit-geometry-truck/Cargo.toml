[package]
name = "rustit-geometry-truck"
description = "Truck CAD-kernel implementation of Rustit's geometry contracts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustit-geometry = { path = "../rustit-geometry" }
thiserror.workspace = true
# Rustit needs Truck's tessellation algorithms, not its optional VTK importer.
# Keeping default features off avoids pulling XML and compression parsers into
# the authoring application when no VTK boundary exists yet.
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["tessellation"] }
truck-modeling = "0.6.0"
truck-stepio = "0.3.0"
